<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puente: Spanish via Italian</title>
<meta name="theme-color" content="#8B4A1F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Puente">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F6; --surface:#FFFFFF; --ink:#1D2733; --muted:#5B6773; --line:#D3DEE6;
  --es:#8B4A1F; --es-soft:#F4E7DC; --it:#C8611A; --it-soft:#FBEADD;
  --cel:#3E86C4; --cel-soft:#DCEBF7; --ok:#2E7D5B; --ok-soft:#E1F1E8; --bad:#B3412E; --bad-soft:#F8E1DC;
  --fs:18px; --ls:0; --ws:0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141A20; --surface:#1E262E; --ink:#E9EEF2; --muted:#9AA7B2; --line:#33404B;
    --es:#E0A27A; --es-soft:#3A2A20; --it:#F0A060; --it-soft:#3D2A1B;
    --cel:#7DB7E8; --cel-soft:#1F3344; --ok:#74C69D; --ok-soft:#1D3328; --bad:#F08A78; --bad-soft:#3D221E;
  }
}
:root[data-theme="dark"]{
  --bg:#141A20; --surface:#1E262E; --ink:#E9EEF2; --muted:#9AA7B2; --line:#33404B;
  --es:#E0A27A; --es-soft:#3A2A20; --it:#F0A060; --it-soft:#3D2A1B;
  --cel:#7DB7E8; --cel-soft:#1F3344; --ok:#74C69D; --ok-soft:#1D3328; --bad:#F08A78; --bad-soft:#3D221E;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible",Verdana,"Segoe UI",Arial,sans-serif;
  font-size:var(--fs);line-height:1.6;letter-spacing:var(--ls);word-spacing:var(--ws)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cel);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 110px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font-size:1.5em;line-height:1.1}
.brand h1 .a{color:var(--it)} .brand h1 .b{color:var(--es)}
.brand small{color:var(--muted);font-size:.78em}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.85em}
h2{font-size:1.25em;margin:8px 0 6px}
h3{font-size:1.05em;margin:18px 0 6px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.88em}
.pill[aria-pressed="true"]{background:var(--es);border-color:var(--es);color:#fff}
.primary{background:var(--es);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:700}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:12px;padding:10px 16px}
.lang-it{color:var(--it);font-weight:700}
.lang-es{color:var(--es);font-weight:700}
mark.d-es{background:var(--es-soft);color:var(--es);border-bottom:2px solid var(--es);padding:0 1px;border-radius:2px}
mark.d-it{background:var(--it-soft);color:var(--it);border-bottom:2px dotted var(--it);padding:0 1px;border-radius:2px}
.speak{border:0;background:var(--cel-soft);color:var(--cel);border-radius:999px;width:38px;height:38px;flex:0 0 38px;font-size:1em;line-height:1}
/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{background:none;border:0;padding:10px 2px 12px;font-size:.78em;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ic{font-size:1.35em;line-height:1}
nav.tabs button[aria-current="page"]{color:var(--es);font-weight:700}
nav.tabs button[aria-current="page"] .ic{transform:translateY(-1px)}
/* bridge rows */
.bridge{display:grid;grid-template-columns:1fr auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.bridge:first-of-type{border-top:0}
.bridge .arrow{color:var(--muted)}
.bridge .note{grid-column:1/-1;font-size:.84em;color:var(--muted);margin-top:-4px}
.rule{background:var(--cel-soft);border-radius:10px;padding:10px 12px;margin:6px 0 10px}
details.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:0 0 10px}
details.group summary{list-style:none;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
details.group summary::-webkit-details-marker{display:none}
details.group summary .count{font-weight:400;color:var(--muted);font-size:.85em}
details.group .body{padding:0 16px 14px}
/* flashcard */
.card{perspective:1200px;margin:6px 0 14px}
.card .inner{position:relative;min-height:330px;transition:transform .45s ease;transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:22px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;border:2px solid}
.face.front{background:var(--it-soft);border-color:var(--it)}
.face.back{background:var(--es-soft);border-color:var(--es);transform:rotateY(180deg)}
.face .tag{font-size:.78em;color:var(--muted)}
.face .word{font-size:1.75em;font-weight:700;line-height:1.25}
.face.front .word{color:var(--it)} .face.back .word{color:var(--es)}
.face .sub{font-size:.9em;color:var(--muted);max-width:32ch}
@media (prefers-reduced-motion:reduce){.card .inner{transition:none}}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--es);border-radius:99px}
/* quiz */
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.explain{border-left:4px solid var(--cel);padding:8px 12px;background:var(--cel-soft);border-radius:0 10px 10px 0;margin-top:8px}
input[type=text],textarea{width:100%;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px}
input[type=text]:focus,textarea:focus{border-color:var(--cel);outline:none}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px}
.fb.ok{background:var(--ok-soft);color:var(--ok)} .fb.no{background:var(--bad-soft);color:var(--bad)} .fb.near{background:var(--cel-soft);color:var(--cel)}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.keys button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 12px}
/* plan */
.day{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day input{width:24px;height:24px;margin-top:3px;accent-color:var(--es)}
.day .n{font-weight:700}
.day.done .t{text-decoration:line-through;color:var(--muted)}
.today{border:2px solid var(--es)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.4em;color:var(--es)}
.stat span{font-size:.8em;color:var(--muted)}
.log li{padding:10px 0;border-top:1px solid var(--line);list-style:none}
.log{padding:0;margin:0}
.log .x{float:right;border:0;background:none;color:var(--muted)}
.hide{display:none!important}
.settings label{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);max-width:420px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.35)}

.card.mouse:focus{outline:none}
.card-ex{margin-top:6px;padding-top:10px;border-top:1px dashed var(--line);font-size:.9em;max-width:34ch}
.card-ex .es{color:var(--ink);font-weight:700}.card-ex .it{color:var(--muted)}
.card-ex .speak{width:30px;height:30px;font-size:.8em;vertical-align:middle}
.nb-ex{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.nb-ex .es{font-weight:700}.nb-ex .it{color:var(--it);font-size:.9em}
.nb-ex.inrow{grid-column:1/-1;margin:0 0 4px;font-size:.92em}
.nb-ex.inrow .speak{width:32px;height:32px;flex:0 0 32px;font-size:.85em}
.paper{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(1.6em - 1px),var(--line) calc(1.6em - 1px),var(--line) 1.6em);background-position:0 .3em;padding-top:6px}
.nb-grid,.nb-rule{background:var(--surface);border:1.5px solid var(--ink);border-radius:6px;padding:8px 12px;margin:12px 0}
.nb-title{font-weight:700;color:var(--es);margin-bottom:4px;border-bottom:2px solid var(--es);display:inline-block}
.nb-row{display:grid;grid-template-columns:minmax(4.5em,auto) 1fr 2px minmax(4.5em,auto) 1fr;gap:4px 10px;align-items:baseline;padding:2px 0}
.nb-row .p{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.nb-row .e{font-weight:700;color:var(--es)}
.nb-row .bar2{background:var(--ink);align-self:stretch;width:2px}
.nb-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nb-row2 span:first-child{border-right:2px solid var(--ink);padding-right:10px}
.nb-note{background:var(--cel-soft);border-radius:8px;padding:8px 10px;font-size:.92em}
nav.tabs button{font-size:.72em}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1><span class="a">Pon</span><span class="b">te</span> → <span class="b">Puente</span></h1></div>
    <button class="iconbtn" id="openSettings" aria-haspopup="dialog">Aa Settings</button>
  </header>
  <main id="view" aria-live="polite"></main>
</div>

<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-tab="today"><span class="ic" aria-hidden="true">☀️</span>Today</button>
  <button data-tab="bridges"><span class="ic" aria-hidden="true">🌉</span>Bridges</button>
  <button data-tab="cards"><span class="ic" aria-hidden="true">🃏</span>Cards</button>
  <button data-tab="traps"><span class="ic" aria-hidden="true">🪤</span>Traps</button>
  <button data-tab="vos"><span class="ic" aria-hidden="true">🧉</span>Vos</button>
  <button data-tab="notebook"><span class="ic" aria-hidden="true">📓</span>Notes</button>
</div></nav>

<dialog id="settings">
  <h2>Reading and listening</h2>
  <div class="settings">
    <label>Text size <input type="range" id="sz" min="15" max="24" step="1"></label>
    <label>Extra letter spacing <input type="checkbox" id="sp"></label>
    <label>Speech speed
      <select id="rate"><option value="0.7">Slow</option><option value="0.9">Relaxed</option><option value="1">Normal</option></select></label>
    <label>Theme
      <select id="theme"><option value="">Match device</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
  </div>
  <p class="muted" id="voiceInfo"></p>
  <div class="row"><button class="primary" id="closeSettings">Done</button></div>
</dialog>

<script>
/* ---------------- storage ---------------- */
const store={
  get(k,d){try{const v=localStorage.getItem("puente:"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("puente:"+k,JSON.stringify(v))}catch(e){}}
};

/* ---------------- data ---------------- */
const GROUPS=[
 {id:"endings",name:"Ending patterns",rule:"Italian endings turn into Spanish endings, and the gender usually travels with them. -zione → -ción, -tà → -dad, -aggio → -aje, -ore → -or.",cards:[
  ["informazione","información","-zione → -ción, feminine"],["università","universidad","-tà → -dad, feminine"],
  ["città","ciudad","-tà → -dad"],["libertà","libertad",""],["gioventù","juventud","-tù → -tud"],
  ["bellezza","belleza","-ezza → -eza"],["esperienza","experiencia","-enza → -encia"],["importanza","importancia","-anza → -ancia"],
  ["energia","energía","stressed -ia → -ía"],["movimento","movimiento","action noun → -miento"],["momento","momento","learned word stays -mento"],
  ["viaggio","viaje","-aggio → -aje, masculine"],["messaggio","mensaje",""],["colore","color","-ore → -or, masculine"],
  ["giocatore","jugador","-atore → -ador"],["venditore","vendedor","-itore → -edor"],["pericoloso","peligroso","-oso stays"],
  ["pubblico","público","-ico gets an accent"],["possibile","posible","-ibile → -ible"],["facilmente","fácilmente","adverb keeps the accent"]]},
 {id:"shifts",name:"Sound shifts",rule:"Stressed e → ie, stressed o/uo → ue, -tt- → -ch-, f- → h-, -gli-/-cchi- → -j-, chi-/pi- → ll-, gn/nn → ñ, s+consonant → es-, p/t/c between vowels → b/d/g.",cards:[
  ["tempo","tiempo","e → ie"],["festa","fiesta","e → ie"],["sempre","siempre","e → ie"],["porta","puerta","o → ue"],
  ["fuoco","fuego","uo → ue, c → g"],["nuovo","nuevo","uo → ue"],["notte","noche","-tt- → -ch- (French nuit)"],
  ["latte","leche","-tt- → -ch- (French lait)"],["otto","ocho","-tt- → -ch- (French huit)"],["fatto","hecho","f → h, -tt- → -ch-"],
  ["fare","hacer","f → h"],["figlio","hijo","f → h, -gli- → -j-"],["fumo","humo","f → h"],["fame","hambre","f → h"],
  ["meglio","mejor","-gli- → -j-"],["occhio","ojo","-cchi- → -j-"],["vecchio","viejo","-cchi- → -j-"],
  ["chiamare","llamar","chi- → ll-"],["chiave","llave","chi- → ll-"],["pioggia","lluvia","pi- → ll-"],
  ["montagna","montaña","gn → ñ"],["sogno","sueño","gn → ñ, o → ue"],["anno","año","nn → ñ"],
  ["studio","estudio","s+consonant → es-"],["scuola","escuela","sc- → esc-, uo → ue"],["sapere","saber","p → b between vowels"],
  ["vita","vida","t → d between vowels"],["amico","amigo","c → g between vowels"],["avere","haber","v → b"],
  ["governo","gobierno","v → b, e → ie"],["attenzione","atención","double letters → single"]]},
 {id:"twins",name:"Irregular twins",rule:"Start from the Italian you actually say (ho fatto, ho voluto). In Buenos Aires that becomes one word in the pretérito: hice, quise. The passato remoto in brackets is only a bonus: it has the same irregular stem.",cards:[
  ["(io) tengo","(yo) tengo","tenere / tener: identical","Tengo una reunión a las tres.","Ho una riunione alle tre."],
  ["(io) vengo","(yo) vengo","identical","Vengo de Roma.","Vengo da Roma."],
  ["(io) metto / pongo","(yo) pongo","poner = mettere","Pongo el celular en la mesa.","Metto il cellulare sul tavolo."],
  ["(io) esco","(yo) salgo","salir = uscire (not salire!)","Salgo a las ocho.","Esco alle otto."],
  ["ho fatto (feci)","hice","one word, no auxiliary","Ayer hice las compras.","Ieri ho fatto la spesa."],
  ["ho detto (dissi)","dije","","Le dije que sí.","Gli ho detto di sì."],
  ["sono venuta (venni)","vine","no essere, no -a agreement","Vine a Buenos Aires en enero.","Sono venuta a Buenos Aires a gennaio."],
  ["ho saputo (seppi)","supe","supe = I found out, like ho saputo","Lo supe ayer.","L'ho saputo ieri."],
  ["ho voluto (volli)","quise","quise = I tried; no quise = I refused","Quise llamarte, pero no pude.","Volevo chiamarti, ma non ho potuto."],
  ["ho potuto (potei)","pude","","No pude ir a la clase.","Non sono potuta andare a lezione."],
  ["ho avuto (ebbi)","tuve","","Tuve una semana larga.","Ho avuto una settimana lunga."],
  ["ho messo (misi)","puse","","Puse las llaves en la mesa.","Ho messo le chiavi sul tavolo."],
  ["sono andata","fui (ir)","fui = went AND was","Fui al centro con Sofía.","Sono andata in centro con Sofia."],
  ["è stato","fue (ser)","","Fue un día largo.","È stata una giornata lunga."],
  ["farò","haré","in speech: voy a hacer","Mañana haré la tarea.","Domani farò i compiti."],
  ["potrai","podrás","vos: podrás too","¿Podrás venir el sábado?","Potrai venire sabato?"],
  ["saprò","sabré","","Lo sabré mañana.","Lo saprò domani."],
  ["verrò","vendré","Spanish adds d","Vendré a las nueve.","Verrò alle nove."],
  ["avrò tempo","tendré tiempo","tener for possession","Tendré tiempo el viernes.","Avrò tempo venerdì."],
  ["(che) sia","(que) sea","","No creo que sea fácil.","Non credo che sia facile."],
  ["(che) vada","(que) vaya","a porteño goodbye","¡Que te vaya bien!","In bocca al lupo! (lit. che ti vada bene)"],
  ["(che) sia arrivato","(que) haya llegado","haber, never ser","Espero que haya llegado bien.","Spero che sia arrivato bene."],
  ["(che) tu stia","(que) estés","","Espero que estés bien.","Spero che tu stia bene."]]},
 {id:"false",name:"False friends",rule:"Same shape, different meaning. Left: the Italian. Right: what you actually want in Spanish.",cards:[
  ["burro (butter)","manteca","burro = donkey!","Pan con manteca, por favor.","Pane e burro, per favore."],
  ["imbarazzata","me da vergüenza","embarazada = pregnant!","Me da vergüenza hablar en público.","Mi imbarazza parlare in pubblico."],
  ["salire (go up)","subir","salir = go out","Subo al tercer piso.","Salgo al terzo piano."],

  ["guardare (look)","mirar","guardar = keep, save","¡Mirá esa casa!","Guarda quella casa!"],
  ["largo (wide)","ancho","largo = long","La avenida es muy ancha.","Il viale è molto largo."],
  ["fa caldo","hace calor","caldo = broth","Hoy hace mucho calor.","Oggi fa molto caldo."],
  ["camera (room)","pieza / habitación","cámara = camera","Alquilo una pieza en Almagro.","Affitto una camera ad Almagro."],
  ["pronta (ready)","lista","pronto = soon","¿Estás lista?","Sei pronta?"],
  ["subito","enseguida","súbito = sudden","Vuelvo enseguida.","Torno subito."],
  ["rumore","ruido","rumor = rumour","Hay mucho ruido en la calle.","C'è molto rumore in strada."],
  ["vaso (vase)","florero","vaso = drinking glass","Puse las flores en un florero.","Ho messo i fiori in un vaso."],
  ["carta (paper)","papel","carta = letter","¿Tenés un papel?","Hai un foglio di carta?"],
  ["tasca (pocket)","bolsillo","tasca = tavern","Tengo el celular en el bolsillo.","Ho il cellulare in tasca."],
  ["officina","taller","oficina = office","Llevé la bici al taller.","Ho portato la bici in officina."],
  ["autista (driver)","chofer","autista = autistic","Le pregunté al chofer.","Ho chiesto all'autista."],
  ["morbido (soft)","suave","mórbido = morbid","Esta almohada es muy suave.","Questo cuscino è molto morbido."],
  ["prendere un caffè","tomar un café","prender = turn on (AR)","¿Tomamos un café?","Prendiamo un caffè?"],
  ["anche","también","aunque = although","Yo también.","Anch'io."],
  ["ho (avere)","tengo (tener)","haber is only an auxiliary","Tengo dos hermanos.","Ho due fratelli."]]},
 {id:"gender",name:"Gender flips",rule:"Masculine in Italian, feminine in Spanish (and a few the other way). Learn them as one family.",cards:[
  ["il latte","la leche","","La leche está fría.","Il latte è freddo."],["il sangue","la sangre","","La sangre es roja.","Il sangue è rosso."],
  ["il fiore","la flor","","Compré una flor amarilla.","Ho comprato un fiore giallo."],["il miele","la miel","","La miel está rica.","Il miele è buono."],
  ["il sale","la sal","","Pasame la sal.","Passami il sale."],["il naso","la nariz","","Tengo la nariz tapada.","Ho il naso chiuso."],
  ["il costume (custom)","la costumbre","","Es una costumbre argentina.","È un'usanza argentina."],["il segnale","la señal","","Acá no hay señal.","Qui non c'è segnale."],

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function lcsMask(a,b){
  const A=[...a.toLowerCase()],Bc=[...b.toLowerCase()],n=A.length,m=Bc.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)
    dp[i][j]=A[i]===Bc[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const ma=new Array(n).fill(false),mb=new Array(m).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(A[i]===Bc[j]){ma[i]=mb[j]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  return [ma,mb];
}
function diff(itw,esw){
  const [ma,mb]=lcsMask(itw,esw);
  const paint=(w,mask,cls)=>{let o="",run="",on=null;[...w].forEach((ch,k)=>{const d=!mask[k]&&ch.trim()!=="";
    if(on===null)on=d; if(d!==on){o+=on?`<mark class="${cls}">${esc(run)}</mark>`:esc(run);run="";on=d}run+=ch});
    o+=on?`<mark class="${cls}">${esc(run)}</mark>`:esc(run);return o};
  return [paint(itw,ma,"d-it"),paint(esw,mb,"d-es")];
}

function pickVoice(lang){
  const pref=lang==="es"?["es-AR","es-419","es-US","es-MX","es-ES","es"]:["it-IT","it"];
  for(const p of pref){const v=voices.find(v=>v.lang&&v.lang.replace("_","-").toLowerCase().startsWith(p.toLowerCase()));if(v)return v}
  return null;
}
function say(text,lang="es"){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text.replace(/\(.*?\)/g,"").replace(/\//g,", "));
  const v=pickVoice(lang);if(v)u.voice=v;u.lang=v?v.lang:(lang==="es"?"es-AR":"it-IT");
  u.rate=parseFloat(settings.rate||0.9);speechSynthesis.speak(u);
}

  const front=frontIt?`<span class="tag">Italiano</span><span class="word">${esc(c.it)}</span>${spk(c.it,"it")}<span class="sub">Say the Spanish out loud, then tap to check.</span>`
                     :`<span class="tag">Español</span><span class="word" style="color:var(--es)">${esc(c.es)}</span>${spk(c.es)}<span class="sub">Say the Italian, then tap to check.</span>`;
  const back=`<span class="tag">${frontIt?"Español":"Italiano"}</span><span class="word">${frontIt?b:a}</span>${spk(frontIt?c.es:c.it,frontIt?"es":"it")}<span class="sub">${frontIt?a:b}</span>${c.note?`<span class="sub">${esc(c.note)}</span>`:""}${c.ex?`<div class="card-ex"><span class="es">${esc(c.ex)}</span> ${spk(c.ex)}<br><span class="it">${esc(c.exIt)}</span></div>`:""}`;
  area.innerHTML=`<div class="bar" aria-label="Progress"><i style="width:${cardIdx/cardQueue.length*100}%"></i></div>
   <div class="card" id="card" tabindex="0" role="button" aria-label="Flip card"><div class="inner"><div class="face front" ${frontIt?"":'style="background:var(--es-soft);border-color:var(--es)"'}>${front}</div><div class="face back" ${frontIt?"":'style="background:var(--it-soft);border-color:var(--it)"'}>${back}</div></div></div>
   <div class="row" id="grade" style="visibility:hidden"><button class="ghost" id="g0" style="flex:1">Again</button><button class="primary" id="g1" style="flex:1">Got it</button></div>`;
  const card=$("#card");card.addEventListener("pointerdown",()=>card.classList.add("mouse"));const flip=()=>{card.classList.toggle("flipped");$("#grade").style.visibility="visible";if(card.classList.contains("flipped")&&frontIt)say(c.es)};
  card.onclick=flip;card.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}};
  $("#g0").onclick=()=>{boxes[c.id]=0;store.set("boxes",boxes);cardIdx++;showCard()};
  $("#g1").onclick=()=>{boxes[c.id]=Math.min(4,(boxes[c.id]||0)+1);store.set("boxes",boxes);cardIdx++;showCard()};
}

let qOrder=[],qi=0;
function traps(){
  qOrder=QUIZ.map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,10);qi=0;
  $("#view").innerHTML=`<h2>Traps</h2><p class="muted">Italian logic gives the wrong answer on purpose. Pick the Spanish a porteño would say.</p><div id="qArea"></div>`;
  showQ();
}
function showQ(){
  const area=$("#qArea");
  if(qi>=qOrder.length){area.innerHTML=`<div class="panel"><h2>Ten done.</h2><p>Overall you avoid ${Math.round(quizStats.right/quizStats.total*100)}% of traps.</p><button class="primary" id="qAgain">Ten more</button></div>`;$("#qAgain").onclick=traps;return}
  const [en,opts,ans,why]=QUIZ[qOrder[qi]];
  const order=opts.map((o,i)=>i).sort(()=>Math.random()-.5);
  area.innerHTML=`<div class="bar"><i style="width:${qi/qOrder.length*100}%"></i></div><div class="panel" style="margin-top:12px"><p class="muted">How do you say:</p><h2>${esc(en)}</h2>
   ${order.map(i=>`<button class="opt" data-o="${i}">${esc(opts[i])}</button>`).join("")}<div id="qFb"></div></div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(area.dataset.locked==="1")return;area.dataset.locked="1";
    const pick=+b.dataset.o,ok=pick===ans;quizStats.total++;if(ok)quizStats.right++;store.set("quiz",quizStats);
    document.querySelectorAll(".opt").forEach(x=>{const i=+x.dataset.o;if(i===ans)x.classList.add("right");else if(i===pick)x.classList.add("wrong")});
    say(opts[ans]);
    $("#qFb").innerHTML=`<div class="explain"><b>${ok?"Right.":"Trap."}</b> ${esc(why)}</div><div class="row" style="margin-top:12px">${spk(opts[ans])}<button class="primary" id="qNext">Next</button>${ok?"":`<button class="ghost" id="qLog">Add to error log</button>`}</div>`;
    $("#qNext").onclick=()=>{area.dataset.locked="0";qi++;showQ()};
    if(!ok)$("#qLog").onclick=e=>{errors.unshift({w:opts[pick],c:opts[ans]});store.set("errors",errors);e.target.textContent="Added";e.target.disabled=true};
  });
}

let vq=[],vi=0;
function vos(){
  vq=[];VOS.forEach(v=>{if(v[1])vq.push({inf:v[0],kind:"present",ans:v[1]});if(v[2])vq.push({inf:v[0],kind:"command",ans:v[2]})});
  vq.sort(()=>Math.random()-.5);vq=vq.slice(0,12);vi=0;
  $("#view").innerHTML=`<h2>Vos</h2><div class="rule">Present: drop the -r, add -s, stress the end, no stem change (podés, querés). Command: drop the -r and stress the end (hablá, vení). With a pronoun the accent disappears (fijate, sentate).</div><div id="vArea"></div>`;
  showV();
}
function showV(){
  const area=$("#vArea");
  if(vi>=vq.length){area.innerHTML=`<div class="panel"><h2>¡Muy bien!</h2><button class="primary" id="vAgain">Another round</button></div>`;$("#vAgain").onclick=vos;return}
  const q=vq[vi];
  area.innerHTML=`<div class="bar"><i style="width:${vi/vq.length*100}%"></i></div><div class="panel" style="margin-top:12px">
   <p class="muted">${q.kind==="present"?"Present tense":"Command to a friend"}</p>
   <h2><span class="lang-es">${esc(q.inf)}</span> → ${q.kind==="present"?"vos ___":"¡___!"}</h2>
   <input type="text" id="vIn" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer">
   <div class="keys" aria-label="Accent letters">${["á","é","í","ó","ú"].map(k=>`<button data-k="${k}">${k}</button>`).join("")}</div>
   <div class="row" style="margin-top:12px"><button class="primary" id="vCheck">Check</button><button class="ghost" id="vShow">Show me</button></div><div id="vFb"></div></div>`;
  const inp=$("#vIn");inp.focus();
  document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{inp.value+=b.dataset.k;inp.focus()});
  const next=()=>{vi++;showV()};
  const check=()=>{const v=inp.value.trim().toLowerCase().replace(/^¡|!$/g,"");if(!v)return;
    const fb=$("#vFb");
    if(v===q.ans){fb.innerHTML=`<div class="fb ok">¡Eso! <b>${esc(q.ans)}</b></div>`;say(q.ans);setTimeout(next,1300)}
    else if(strip(v)===strip(q.ans)){fb.innerHTML=`<div class="fb near">Almost: check the accent. <b>${esc(q.ans)}</b> ${spk(q.ans)}</div>`}
    else{fb.innerHTML=`<div class="fb no">It's <b>${esc(q.ans)}</b>. ${spk(q.ans)} <button class="ghost" id="vNext" style="margin-left:8px">Next</button></div>`;say(q.ans);$("#vNext").onclick=next}};
  $("#vCheck").onclick=check;inp.onkeydown=e=>{if(e.key==="Enter")check()};
  $("#vShow").onclick=()=>{$("#vFb").innerHTML=`<div class="fb near"><b>${esc(q.ans)}</b> ${spk(q.ans)} <button class="ghost" id="vNext" style="margin-left:8px">Next</button></div>`;say(q.ans);$("#vNext").onclick=next};
}

/* ---------------- notebook (grammar pages) ---------------- */
const NB=[
 {id:"present",t:"Present, regular",html:`
  <p>Drop -ar / -er / -ir, add the ending. Same shape as your Italian page (o, i, a | iamo, ate, ano).</p>
  ${grid("-AR · hablar (parlare)",["yo","o","nosotros","amos"],["tú / vos","as / <b>ás</b>","ustedes","an"],["él / ella","a","ellos","an"])}
  ${grid("-ER · comer (mangiare)",["yo","o","nosotros","emos"],["tú / vos","es / <b>és</b>","ustedes","en"],["él / ella","e","ellos","en"])}
  ${grid("-IR · vivir (vivere)",["yo","o","nosotros","imos"],["tú / vos","es / <b>ís</b>","ustedes","en"],["él / ella","e","ellos","en"])}
  <p class="nb-note">No vosotros in Buenos Aires: <b>ustedes</b> is the only "you all". Vos stresses the ending: ha-BLÁS, co-MÉS, vi-VÍS.</p>
  ${ex("Vos hablás muy bien.","Parli molto bene.")}${ex("Nosotros vivimos en Almagro.","Viviamo ad Almagro.")}`},
 {id:"past",t:"Pretérito (finished past)",html:`
  <p>Where Rome says <i>ho parlato</i>, Buenos Aires says <b>hablé</b>, even for this morning.</p>
  ${grid("-AR · hablar",["yo","é","nosotros","amos"],["vos / tú","aste","ustedes","aron"],["él / ella","ó","ellos","aron"])}
  ${grid("-ER / -IR · comer, vivir",["yo","í","nosotros","imos"],["vos / tú","iste","ustedes","ieron"],["él / ella","ió","ellos","ieron"])}
  <p class="nb-note">The accent is the whole meaning: <b>hablo</b> = I speak, <b>habló</b> = he spoke.</p>
  ${ex("Esta mañana hablé con mi clienta.","Stamattina ho parlato con la mia cliente.")}${ex("¿Comiste?","Hai mangiato?")}${ex("Ayer salimos tarde.","Ieri siamo usciti tardi.")}`},
 {id:"imperf",t:"Imperfecto (background, habit)",html:`
  <p>Italian <b>-vo, -vi, -va</b> becomes <b>-ba</b> for -ar verbs, and <b>-ía</b> for -er / -ir.</p>
  ${grid("-AR · hablar (parlavo)",["yo","aba","nosotros","ábamos"],["vos / tú","abas","ustedes","aban"],["él / ella","aba","ellos","aban"])}
  ${grid("-ER / -IR · comer (mangiavo)",["yo","ía","nosotros","íamos"],["vos / tú","ías","ustedes","ían"],["él / ella","ía","ellos","ían"])}
  <p class="nb-note">Only three irregulars: <b>era</b> (ser), <b>iba</b> (ir), <b>veía</b> (ver).</p>
  ${ex("Cuando era chica, vivía en Nueva York.","Quando ero piccola, vivevo a New York.")}${ex("Llovía y hacía frío.","Pioveva e faceva freddo.")}`},
 {id:"future",t:"Futuro and condicional",html:`
  <p>Keep the whole infinitive and add the ending. Italian drops the -e (parler-ò); Spanish keeps everything (hablar-é).</p>
  ${grid("Futuro · hablar-",["yo","é","nosotros","emos"],["vos / tú","ás","ustedes","án"],["él / ella","á","ellos","án"])}
  ${grid("Condicional · hablar-",["yo","ía","nosotros","íamos"],["vos / tú","ías","ustedes","ían"],["él / ella","ía","ellos","ían"])}
  <p class="nb-note">Short stems match Italian: tendr- (terr-), podr- (potr-), sabr- (sapr-), har- (far-), dir- (dir-). In speech, porteños use <b>voy a + infinitive</b> for the future.</p>
  ${ex("Mañana voy a trabajar desde casa.","Domani lavorerò da casa.")}${ex("Me gustaría ir.","Mi piacerebbe andare.")}`},
 {id:"subj",t:"Subjuntivo",html:`
  <p><b>Present:</b> swap the vowel. -ar takes e; -er / -ir take a (just like Italian -ere / -ire).</p>
  ${grid("-AR · hable (parli)",["yo","e","nosotros","emos"],["vos / tú","es","ustedes","en"],["él / ella","e","ellos","en"])}
  ${grid("-ER / -IR · coma, viva (mangi, viva)",["yo","a","nosotros","amos"],["vos / tú","as","ustedes","an"],["él / ella","a","ellos","an"])}
  <p><b>Imperfect:</b> take ellos in the pretérito, drop -ron, add -ra. hablaron → hablara (parlassi); tuvieron → tuviera (avessi); fueron → fuera (fossi).</p>
  ${grid("hablar → hablara (parlassi)",["yo","hablara","nosotros","habláramos"],["vos / tú","hablaras","ustedes","hablaran"],["él / ella","hablara","ellos","hablaran"])}
  <p class="nb-note">The big split from Italian: <b>creo que es</b> (not sea), but <b>no creo que sea</b>. And <b>cuando llegues</b>, never cuando llegarás.</p>
  ${ex("Espero que estés bien.","Spero che tu stia bene.")}${ex("No creo que sea fácil.","Non credo che sia facile.")}${ex("Cuando llegues, avisame.","Quando arrivi, avvisami.")}`},
 {id:"si",t:"Conditionals (si clauses)",html:`
  <p>Your Italian page, in Spanish. Same four types, same rule: <b>never conditional after si</b> (se avrei ✗ → si tendría ✗).</p>
  ${rule("1 · Real / likely","Si + present","present or future")}
  ${ex("Si como demasiado, me siento mal.","Se mangio troppo, mi sento male.")}${ex("Si llueve mañana, me quedo en casa.","Se piove domani, resterò a casa.")}
  ${rule("2 · Hypothetical present","Si + imperfect subjunctive","present conditional")}
  ${ex("Si tuviera más plata, viajaría más.","Se avessi più soldi, viaggerei di più.")}${ex("Si fuera vos, no lo haría.","Se fossi te, non lo farei.")}
  ${rule("3 · Hypothetical past","Si + pluperfect subjunctive","past conditional")}
  ${ex("Si no hubieran cancelado los vuelos, habría llegado.","Se non avessero annullato i voli, sarebbe arrivato.")}
  ${rule("4 · Mixed: unreal past, present result","Si + pluperfect subjunctive","present conditional")}
  ${ex("Si no hubieran cancelado los vuelos, él estaría acá hoy.","Se non avessero annullato i voli, lui sarebbe qui oggi.")}
  <p class="nb-note">In speech you will hear <i>te lo hubiera dicho</i> in the result clause. In the exam, write <b>habría dicho</b>.</p>`},
 {id:"neg",t:"Negatives",html:`
  <p>Simpler than French: just <b>no</b> before the verb (and before any pronouns). Like Italian <i>non</i>.</p>
  ${rule("Present / future","no + verb","No hablo. No voy a ir.")}
  ${rule("Compound past","no + haber + participle","No he terminado.")}
  ${rule("Reflexive","no + pronoun + verb","No me maquillé.")}
  <p>Double negatives are normal, exactly like Italian <i>non... mai</i>:</p>
  ${ex("No voy nunca.","Non ci vado mai.")}${ex("No vi a nadie.","Non ho visto nessuno.")}${ex("No quiero nada.","Non voglio niente.")}
  <p class="nb-note">nunca = mai, nada = niente, nadie = nessuno, tampoco = neanche, ni... ni = né... né.</p>`},
 {id:"demo",t:"Demonstratives",html:`
  <p>Three distances instead of Italian's two: near me, near you, over there.</p>
  ${grid("este · this (questo)",["masc.","este","plural","estos"],["fem.","esta","plural","estas"])}
  ${grid("ese · that, near you",["masc.","ese","plural","esos"],["fem.","esa","plural","esas"])}
  ${grid("aquel · that, over there (quello)",["masc.","aquel","plural","aquellos"],["fem.","aquella","plural","aquellas"])}
  <p class="nb-note">For an idea or something unnamed: <b>esto, eso, aquello</b> (ciò, questo, quello). No -ci / -là needed, the word already says the distance.</p>
  ${ex("Esta casa es linda, pero prefiero aquella.","Questa casa è bella, ma preferisco quella.")}${ex("¿Qué es eso?","Cos'è quello?")}`},
 {id:"q",t:"Question words and everyday words",html:`
  ${grid("Questions (always with an accent)",["¿Cuándo?","Quando?","¿Dónde?","Dove?"],["¿Quién?","Chi?","¿Por qué?","Perché?"],["¿Qué?","Cosa? / Che?","¿Cómo?","Come?"],["¿Cuánto?","Quanto?","¿Cuál?","Quale?"])}
  <p class="nb-note">The answer <b>porque</b> (because) is one word with no accent.</p>
  ${grid("Place and time",["acá","qui (AR; Spain: aquí)","allá","là (AR; Spain: allí)"],["siempre","sempre","nunca","mai"],["seguido","spesso (AR; also a menudo)","a veces","a volte"],["ya","già","todavía","ancora"])}
  ${ex("¿Dónde nos vemos? Acá, en la esquina.","Dove ci vediamo? Qui, all'angolo.")}${ex("Todavía no llegó.","Non è ancora arrivato.")}`}
];
function grid(title,...rows){
  return `<div class="nb-grid"><div class="nb-title">${title}</div>${rows.map(r=>`<div class="nb-row"><span class="p">${r[0]}</span><span class="e">${r[1]}</span><span class="bar2" aria-hidden="true"></span><span class="p">${r[2]||""}</span><span class="e">${r[3]||""}</span></div>`).join("")}</div>`;
}
function rule(t,a,b){return `<div class="nb-rule"><div class="nb-title">${t}</div><div class="nb-row2"><span>${a}</span><span>${b}</span></div></div>`}
function ex(es,itx){return `<div class="nb-ex">${spk(es)}<div><div class="es">${es}</div><div class="it">${itx}</div></div></div>`}
let openNb=null;
function notebook(){
  let h=`<h2>Notebook</h2><p class="muted">Grammar pages in your notebook format: endings grid, then real sentences. Tap 🔊 to hear each one.</p>`;
  NB.forEach(s=>{h+=`<details class="group nb" ${openNb===s.id?"open":""}><summary>${esc(s.t)}</summary><div class="body paper">${s.html}</div></details>`});
  $("#view").innerHTML=h;openNb=null;
}
